[package]
name = "host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
repository.workspace = true
anyhow.workspace = true
wasmtime = { version = "26", features = ["component-model"] }
wasmtime-wasi = "26"
# Auth I/O (Phase 1 item 3 host seam): token generation, hashing, HS256 JWT.
# Vetted pure-Rust crypto — no hand-rolled primitives.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests construct parsed WhatsApp input, which needs an IANA zone for parse_export.
chrono-tz = { version = "0.10", default-features = false }

[[bin]]
name = "host"
path = "src/main.rs"
