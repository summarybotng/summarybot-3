[package]
name = "host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
repository.workspace = true
anyhow.workspace = true
wasmtime = { version = "26", features = ["component-model"] }
wasmtime-wasi = "26"
# Auth I/O (Phase 1 item 3 host seam): token generation, hashing, HS256 JWT.
# Vetted pure-Rust crypto — no hand-rolled primitives.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
# Reversible encryption of stored tenant API keys (ADR-125 Phase 2b): AES-256-GCM
# with an operator master key. Vetted pure-Rust crypto — no hand-rolled AEAD.
aes-gcm = "0.10"
# Unzip uploaded WhatsApp exports (WHA-001) to read the chat transcript. Deflate
# only — exports are deflate-compressed; keeps the dep surface small.
zip = { version = "2", default-features = false, features = ["deflate"] }
# IANA timezone parsing for WhatsApp export ingestion (WHA-020).
chrono-tz = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenAI-compatible HTTP LLM client (ADR-125). Optional + feature-gated: the
# default build/test stay network-free; enable with `--features http-llm`.
ureq = { version = "2", optional = true, features = ["json"] }
# SMTP client for the email delivery sink (ADR-126). Optional + feature-gated.
# Blocking transport + rustls TLS (no system OpenSSL).
lettre = { version = "0.11", optional = true, default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }

[features]
# OpenAI-compatible HTTP LLM client (OpenRouter, OpenAI, local Ollama/LM Studio).
http-llm = ["dep:ureq"]
# Confluence delivery sink plugin (ADR-126) — publishes summaries to Confluence
# Cloud over REST. Optional + network-gated like http-llm.
confluence = ["dep:ureq"]
# Email (SMTP) delivery sink plugin (ADR-126).
email = ["dep:lettre"]
# OAuth 2.0 authorization-code flow (login + integration credentials, ADR-126).
oauth = ["dep:ureq"]
# Google Drive delivery sink plugin (ADR-126): publishes summaries as Google
# Docs. Needs the OAuth core for token refresh.
gdrive = ["dep:ureq", "oauth"]

[[bin]]
name = "host"
path = "src/main.rs"
