[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Build the OpenAI-compatible HTTP LLM backend into the server (off by default so
# the default build stays network-free). At runtime, point it at a local endpoint
# (LLM_BASE_URL — e.g. the operator's Mac mini) or OpenRouter (OPENROUTER_API_KEY).
# See ADR-125.
http-llm = ["host/http-llm"]
# Confluence delivery sink plugin (ADR-126). Optional + network-gated.
confluence = ["host/confluence"]
# Email (SMTP) delivery sink plugin (ADR-126). Optional + network-gated.
email = ["host/email"]
# OAuth 2.0 login flow (ADR-126). Optional + network-gated.
oauth = ["host/oauth", "dep:base64"]

[dependencies]
domain.workspace = true
repository.workspace = true
host = { path = "../host" }
anyhow.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
# Bridges a tokio broadcast channel into a Stream for the SSE live-events feed.
tokio-stream = { version = "0.1", features = ["sync"] }
# Serve the built SPA (static assets + index.html SPA fallback).
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# URL-safe base64 for the OAuth callback's session fragment. Gated by `oauth`.
base64 = { version = "0.22", optional = true }

[dev-dependencies]
# Tower's ServiceExt::oneshot drives the router in tests without a real socket.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros"] }

[[bin]]
name = "api"
path = "src/main.rs"
